# Ira Fine-Tuning Configuration
# ================================

model:
  base: "meta-llama/Llama-3.1-8B-Instruct"
  output_repo: "buildlikeshane/ira-beam-assistant"

training:
  # LoRA settings (efficient fine-tuning)
  use_lora: true
  lora_r: 16
  lora_alpha: 32
  lora_dropout: 0.05

  # Training hyperparameters
  epochs: 3
  batch_size: 4
  gradient_accumulation_steps: 4
  learning_rate: 2e-4
  warmup_ratio: 0.03
  weight_decay: 0.001
  max_seq_length: 2048

  # Optimization
  optimizer: "adamw_8bit"
  lr_scheduler: "cosine"
  fp16: true
  gradient_checkpointing: true

data:
  train_file: "data/train.jsonl"
  eval_file: "data/eval.jsonl"
  eval_split: 0.1

persona:
  name: "Ira"
  archetypes:
